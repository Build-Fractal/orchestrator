name: Bug report
description: Something in the orchestrator isn't working as expected.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please include enough for a maintainer to reproduce.
        (Found a defect against a specific spec chunk during UAT? Use the **UAT Bug** template instead.)

  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect instead?
      placeholder: "Expected X, observed Y."
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The minimum steps to observe the problem.
      placeholder: |
        1. Run `/orchestrator-...` (or `bash scripts/...`)
        2. Observe ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `orchestrator --version`.
      placeholder: "0.9.3"
    validations:
      required: true

  - type: dropdown
    id: channel
    attributes:
      label: Install channel
      options:
        - npm
        - Homebrew
        - curl | bash
        - from source (clone)
        - not sure
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS + runtime (Claude Code / Codex CLI / Cursor) + shell.
      placeholder: "macOS 14.5, Claude Code, bash 3.2"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output / logs
      description: Paste any error output, `run-doctor.sh` lines, or `.orchestrator/` state that helps. Redact anything sensitive.
      render: shell
    validations:
      required: false
