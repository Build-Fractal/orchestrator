# .github/workflows/release.yml
# M035 P02 T04 — npm publishing pipeline (Build-Fractal/orchestrator).
#
# Two jobs:
#   pr-validate — runs on PR + main-push, no secret access, exercises
#                 packaging shape and the cross-channel byte-equivalence
#                 test (npm-channel arm).
#   npm-publish — runs only on v* tag push, has NPM_TOKEN access,
#                 runs `npm publish --access public`. CON-6
#                 secrets-scope discipline.
#
# Runner: ubuntu-latest (D001). macOS matrix is deferred to P03 when
# homebrew arm needs `brew`.
#
# Bash 4+ is permitted in CI scripts per CON-2; install scripts
# remain bash 3.2 compatible per the M035 spec.

name: release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # -----------------------------------------------------------------
  # PR-validate — no secrets, runs on PR + main-push.
  # -----------------------------------------------------------------
  pr-validate:
    name: pr-validate (npm pack + byte-equivalence)
    runs-on: ubuntu-latest
    # Run on PRs AND on main pushes (but NOT on tag pushes — that's
    # npm-publish's job; pr-validate would be redundant on tag).
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Verify package.json shape
        run: bash tools/verify/m035-p02-package-json-shape.sh

      - name: Verify bin/orchestrator entry point
        run: bash tools/verify/m035-p02-bin-entry.sh

      - name: Verify postinstall driver shape
        run: bash tools/verify/m035-p02-postinstall-shape.sh

      - name: Verify exclusion-list documentation
        run: bash tools/verify/m035-p02-installation-doc-exclusion-list.sh

      - name: Verify bundle-hygiene filter (T05)
        # T05 authors this verifier alongside the bundle filter.
        # PR-validate runs it once T05 has landed; until then,
        # the step is conditional on file presence.
        run: |
          if [ -x tools/verify/m035-p02-bundle-hygiene-filter.sh ]; then
            bash tools/verify/m035-p02-bundle-hygiene-filter.sh
          else
            echo "SKIP: bundle-hygiene verifier not yet on disk (pending T05)"
          fi

      - name: Run cross-channel byte-equivalence (npm-channel arm)
        run: bash tests/m035-acceptance/cross-channel-byte-equivalence.sh

      # MOS-3: Homebrew formula install correctness. Packs the tarball,
      # replicates brew's unpack-and-strip, simulates the formula's
      # install + bin-symlink steps, and asserts the on-PATH entry point
      # resolves to an executable. Guards the two-part bug that shipped a
      # binary-less Cellar in v0.9.8 (package/* glob + prefix self-symlink).
      # Pure npm-pack + shell — no `brew` needed, so it runs on the ubuntu
      # runner. Was the missing pre-release gate that let v0.9.8 ship broken.
      - name: Verify Homebrew formula install glob (MOS-3)
        run: bash tools/verify/m035-p03-formula-install-glob.sh

      - name: Verify npm pack contents (T05)
        run: |
          if [ -x tools/verify/m035-p02-npm-pack-contents.sh ]; then
            bash tools/verify/m035-p02-npm-pack-contents.sh
          else
            echo "SKIP: npm-pack-contents verifier not yet on disk (pending T05)"
          fi

      # CON-6 negative-assertion: pr-validate MUST NOT have NPM_TOKEN
      # in env. Asserts secret-scoping at the workflow level.
      - name: CON-6 — assert no NPM_TOKEN access
        run: |
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "FAIL: NPM_TOKEN visible to pr-validate job — CON-6 violated" >&2
            exit 1
          fi
          echo "PASS: NPM_TOKEN not visible to pr-validate (CON-6)"

      - name: CON-6 — assert no HOMEBREW_TAP_TOKEN access
        run: |
          if [ -n "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "FAIL: HOMEBREW_TAP_TOKEN visible to pr-validate job — CON-6 violated" >&2
            exit 1
          fi
          echo "PASS: HOMEBREW_TAP_TOKEN not visible to pr-validate (CON-6)"

  # -----------------------------------------------------------------
  # npm-publish — secrets-scoped to v* tag push only (CON-6).
  # SC-14 asserts this job-condition at acceptance-battery time.
  # -----------------------------------------------------------------
  npm-publish:
    name: npm-publish (tag-push only)
    runs-on: ubuntu-latest
    # CON-8 (M035 P04 T02 / D010): 20-minute timeout on ubuntu-latest.
    # Escalation: if measured wall-clock consistently >15min across
    # three synthetic-tag runs, split into parallel jobs or document
    # a revised timeout.
    timeout-minutes: 20
    # CON-6: this job runs ONLY on v* tag push events, never on
    # PRs and never on main-branch pushes. SC-14 verifies this
    # condition mechanically via tools/verify/m035-p02-release-
    # workflow-shape.sh.
    if: ${{ startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push' }}
    # M035 P05 T03 — job-level permissions override.
    # The workflow-level `permissions: contents: read` (top of file)
    # stays unchanged; this block opts THIS job into the additional
    # scopes it needs:
    #   contents: write — gh release create writes the GitHub release.
    #   id-token: write — sigstore cosign keyless signing binds the
    #                     workflow's OIDC identity into the Rekor log.
    # Other jobs (pr-validate) inherit the workflow-level read-only
    # permission and gain neither scope. Least-privilege preserved.
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Verify tag matches package.json version
        run: |
          # Strip leading v from the tag.
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION="$(grep -E '^\s*"version"\s*:' package.json \
            | head -1 \
            | sed -E 's/.*"version"\s*:\s*"([^"]+)".*/\1/')"
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "FAIL: tag v$TAG does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi
          echo "PASS: tag v$TAG matches package.json version $PKG_VERSION"

      - name: Run pre-publish gates
        run: |
          bash tools/verify/m035-p02-package-json-shape.sh
          bash tools/verify/m035-p02-bin-entry.sh
          bash tools/verify/m035-p02-postinstall-shape.sh
          bash tests/m035-acceptance/cross-channel-byte-equivalence.sh

      - name: npm publish (public access)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # --access public is required for scoped packages (@scope/name)
          # to be published as public. Default for scoped is restricted.
          npm publish --access public

      # ---------------------------------------------------------------
      # M035 P05 T03 — sigstore (cosign keyless) signing + SHA-256
      # checksum publication. Resolves D004:
      #   * sigstore primary (cosign sign-blob keyless, OIDC bound)
      #   * SHA256SUMS fallback (tooling-free verification path).
      # SC-11 asserts both surfaces succeed against the published
      # release artifacts. The signing block iterates over a glob so
      # P03 (homebrew bottle), P04 (curl-pipe-bash install.sh), and
      # any future channel artifacts extend by simply staging their
      # artifact into release-artifacts/ — no edit to the loop needed.
      # ---------------------------------------------------------------

      - name: Setup cosign
        # Pin both the action version AND the cosign release version
        # for reproducibility (Constitution Principle XVI: dependency
        # immutability at release time).
        uses: sigstore/cosign-installer@v3.5.0
        with:
          cosign-release: 'v2.2.4'

      - name: Stage release artifacts
        run: |
          mkdir -p release-artifacts
          # npm tarball: re-pack locally rather than re-downloading
          # from the registry. The npm-pack output is byte-identical
          # to what `npm publish` just uploaded a moment ago.
          TAG="${GITHUB_REF#refs/tags/v}"
          # @build-fractal/orchestrator -> build-fractal-orchestrator
          # npm pack produces build-fractal-orchestrator-<version>.tgz
          npm pack
          mv build-fractal-orchestrator-"$TAG".tgz release-artifacts/
          # P03 hook: homebrew bottle would land here.
          # P04 (T02): stage install.sh into release-artifacts/.
          # The downstream cosign-sign loop signs install.sh
          # automatically (for artifact in *); SHA256SUMS step
          # computes its digest automatically; gh release create
          # uploads it via release-artifacts/* glob. No edit to
          # those steps required.
          cp packaging/install/install.sh release-artifacts/
          ls -la release-artifacts/

      - name: Generate SHA256SUMS
        working-directory: release-artifacts
        run: |
          # shasum -a 256 emits "<hex>  <filename>" lines.
          # LC_ALL=C sort guarantees locale-independent reproducible
          # ordering (same convention as P02 T03 byte-equivalence
          # helper).
          find . -maxdepth 1 -type f ! -name SHA256SUMS \
            -exec shasum -a 256 {} \; \
            | LC_ALL=C sort -k 2 \
            > SHA256SUMS
          cat SHA256SUMS

      - name: Sign release artifacts (sigstore keyless)
        working-directory: release-artifacts
        env:
          # Defensive belt-and-suspenders for older cosign versions.
          # cosign v2.2+ does not strictly require this; harmless when set.
          COSIGN_EXPERIMENTAL: "1"
        run: |
          # Sign every release artifact (excluding SHA256SUMS itself
          # and any pre-existing .sig/.pem outputs from a prior step).
          # --yes skips the interactive Y/N prompt cosign normally
          # requires for keyless signing under CI.
          for artifact in *; do
            case "$artifact" in
              *.sig|*.pem|SHA256SUMS)
                continue
                ;;
            esac
            echo "Signing $artifact ..."
            cosign sign-blob \
              --yes \
              --output-signature "$artifact.sig" \
              --output-certificate "$artifact.pem" \
              "$artifact"
          done
          # Also sign SHA256SUMS itself so operators can verify the
          # checksum file's authenticity before relying on it.
          cosign sign-blob \
            --yes \
            --output-signature SHA256SUMS.sig \
            --output-certificate SHA256SUMS.pem \
            SHA256SUMS
          ls -la

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          # --generate-notes auto-generates release notes from the
          # commit history since the last release. The job-level
          # `permissions: contents: write` override grants the scope.
          gh release create "v$TAG" \
            --title "v$TAG" \
            --generate-notes \
            release-artifacts/*

      - name: Confirm publish succeeded
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          # Wait briefly for npm registry to propagate the version.
          sleep 5
          npm view "@build-fractal/orchestrator@${TAG}" version

  # -----------------------------------------------------------------
  # homebrew-publish — CON-6: tag-push only, never PR. Runs after
  # npm-publish so the tarball is uploaded to the GitHub release
  # before this job reads its SHA-256. Renders the formula from
  # packaging/homebrew/orchestrator.rb.tmpl, pushes to
  # Build-Fractal/homebrew-orchestrator (D007 + D008).
  # -----------------------------------------------------------------
  homebrew-publish:
    name: homebrew-publish (tag-push only)
    runs-on: ubuntu-latest
    needs: npm-publish
    # CON-8 (M035 P04 T02 / D010): 20-minute timeout on ubuntu-latest.
    # Same shape as npm-publish; per-job timeout means a hung
    # homebrew-publish doesn't block npm-publish's success signal.
    timeout-minutes: 20
    if: ${{ startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push' }}
    permissions:
      contents: read
    steps:
      - name: Checkout (canonical repo)
        uses: actions/checkout@v5

      - name: Resolve version + tarball URL
        id: resolve
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          URL="https://github.com/${{ github.repository }}/releases/download/v${TAG}/build-fractal-orchestrator-${TAG}.tgz"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "tarball=build-fractal-orchestrator-${TAG}.tgz" >> "$GITHUB_OUTPUT"

      - name: Download SHA256SUMS from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.resolve.outputs.version }}"
          gh release download "v$TAG" \
            --repo "${{ github.repository }}" \
            --pattern SHA256SUMS \
            --dir release-artifacts/

      - name: Extract tarball SHA-256
        id: sha256
        run: |
          TAR="${{ steps.resolve.outputs.tarball }}"
          # SHA256SUMS lines are "<hex>  <filename>"; awk extracts
          # the hex for the matching filename. Bash 4+ permitted
          # in CI scripts per CON-2.
          DIGEST=$(awk -v t="$TAR" '$2 == "./" t || $2 == t { print $1 }' release-artifacts/SHA256SUMS)
          if [ -z "$DIGEST" ]; then
            echo "FAIL: could not find SHA-256 for $TAR in SHA256SUMS" >&2
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Render formula
        run: |
          mkdir -p rendered
          bash packaging/homebrew/render-formula.sh \
            --version "${{ steps.resolve.outputs.version }}" \
            --url "${{ steps.resolve.outputs.url }}" \
            --sha256 "${{ steps.sha256.outputs.digest }}" \
            > rendered/orchestrator.rb
          head -5 rendered/orchestrator.rb

      - name: Clone tap repo
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          # D008: PAT scoped to Build-Fractal/homebrew-orchestrator
          # contents:write only. The clone URL embeds the token via
          # the x-access-token user — GitHub's documented PAT-as-
          # password convention for HTTPS git operations.
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "FAIL: HOMEBREW_TAP_TOKEN secret missing — see references/installation.md § Releasing via Homebrew (MOS-2)" >&2
            exit 1
          fi
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/Build-Fractal/homebrew-orchestrator.git" tap-clone
          cd tap-clone
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Write formula and push
        working-directory: tap-clone
        run: |
          TAG="${{ steps.resolve.outputs.version }}"
          mkdir -p Formula
          cp ../rendered/orchestrator.rb Formula/orchestrator.rb
          git add Formula/orchestrator.rb
          # Allow no-op commits to be a no-op (re-running the job
          # for the same tag should not error).
          if git diff --staged --quiet; then
            echo "no-op: Formula/orchestrator.rb unchanged for v$TAG"
            exit 0
          fi
          git commit -m "formula: bump to v$TAG"
          git push origin HEAD:main
