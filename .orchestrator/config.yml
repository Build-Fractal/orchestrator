schema_version: "1.0"
type: orchestrator-config
# state_root: ".orchestrator"  # Example; omit to use rule-3 (existing .orchestrator/) resolution
intensity:
  default: standard
  auto_detect: true
integration:
  speckit: auto  # auto|disabled|enabled
dispatch:
  default_backend: local-agent
knowledge:
  graph_backend: sqlite
dual_write_agents: true  # M014/P01 FR-12 — when false, skip AGENTS.md dual-write
specify:
  complexity_thresholds:
    fr_count: 15              # T01 calibration — gate threshold (above if >= this)
    user_story_count: 5       # T01 calibration — gate threshold (above if >= this)
    raw_token_count: 8000     # T01 calibration — gate threshold (above if >= this)
    todo_density: 0.5         # T01 calibration — todo / (todo + authored-section) ratio above
    contradiction_signal_count: 1  # Any LLM-detected signal trips the probe
  contradiction_signal_criterion: cc-llm-or-zero  # Non-CC runtimes emit zero
  hardening_spec_exception: true  # fr_count==0 treated as strong below-threshold signal
  scaffolder_description_min_words: 80
  scaffolder_llm_on_codex: false
comments:
  # FR-17 (M014/P03): per-class auto-apply confidence thresholds.
  # Pinned conservatively; D023 retune trigger documented in
  # specs/024-spec-management-extended/planning-inputs/inbox-dogfood.md.
  auto_apply_threshold:
    uat-bug: 0.8
    decision-append: 0.8
    spec-amendment: 1.0  # CON-5/SC-5 — never auto-applies regardless.
    ambiguous: 1.0       # always routes through conversus.
  reply_on_apply: false  # OQ #C-8 v1 conservative pin.
  fetch_schedule: manual # OQ #C-2 v1 conservative pin (alternatives: post-verify, cron).

# M018 — Context Compression Layer
# Master toggle (FR-15): when `enabled: false`, the entire compression
# pipeline short-circuits and dispatch payloads are byte-identical to the
# pre-M018 baseline. Per-tier toggles let operators enable individual
# stages independently.
compression:
  enabled: true
  knowledge_filter:
    enabled: true
    # FR-3: knowledge entries whose YAML frontmatter `status:` field
    # matches any value in this list are excluded from the dispatch
    # payload. Missing `status:` → RETAINED (fail-open per A-1).
    drop_list:
      - superseded
      - experimental
