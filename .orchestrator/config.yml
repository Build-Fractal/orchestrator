schema_version: "1.0"
type: orchestrator-config
# state_root: ".orchestrator"  # Example; omit to use rule-3 (existing .orchestrator/) resolution
intensity:
  default: standard
  auto_detect: true
integration:
  speckit: auto  # auto|disabled|enabled
dispatch:
  default_backend: local-agent
knowledge:
  graph_backend: sqlite
dual_write_agents: true  # M014/P01 FR-12 — when false, skip AGENTS.md dual-write
specify:
  complexity_thresholds:
    fr_count: 15              # T01 calibration — gate threshold (above if >= this)
    user_story_count: 5       # T01 calibration — gate threshold (above if >= this)
    raw_token_count: 8000     # T01 calibration — gate threshold (above if >= this)
    todo_density: 0.5         # T01 calibration — todo / (todo + authored-section) ratio above
    contradiction_signal_count: 1  # Any LLM-detected signal trips the probe
  contradiction_signal_criterion: cc-llm-or-zero  # Non-CC runtimes emit zero
  hardening_spec_exception: true  # fr_count==0 treated as strong below-threshold signal
  scaffolder_description_min_words: 80
  scaffolder_llm_on_codex: false
comments:
  # FR-17 (M014/P03): per-class auto-apply confidence thresholds.
  # Pinned conservatively; D023 retune trigger documented in
  # specs/024-spec-management-extended/planning-inputs/inbox-dogfood.md.
  auto_apply_threshold:
    uat-bug: 0.8
    decision-append: 0.8
    spec-amendment: 1.0  # CON-5/SC-5 — never auto-applies regardless.
    ambiguous: 1.0       # always routes through conversus.
  reply_on_apply: false  # OQ #C-8 v1 conservative pin.
  fetch_schedule: manual # OQ #C-2 v1 conservative pin (alternatives: post-verify, cron).

# M018 — Context Compression Layer
# Master toggle (FR-15): when `enabled: false`, the entire compression
# pipeline short-circuits and dispatch payloads are byte-identical to the
# pre-M018 baseline. Per-tier toggles let operators enable individual
# stages independently.
compression:
  enabled: true
  knowledge_filter:
    enabled: true
    # FR-3: knowledge entries whose YAML frontmatter `status:` field
    # matches any value in this list are excluded from the dispatch
    # payload. Missing `status:` → RETAINED (fail-open per A-1).
    drop_list:
      - superseded
      - experimental
  # M018/P02/T03 (MIT-09): aggregate-savings underperformance self-check.
  # Operational signal — emits a `compression_underperformance` JSONL record
  # when the running mean payload-token reduction across the last
  # `window_size` `payload_breakdown` records falls below `floor_pct`. Never
  # blocks dispatch. `min_sample_size` guards against spurious alarms while
  # P02 is the only shipping tier (tier1/tier2/tier3 land in P03/P04/P06).
  underperformance:
    enabled: true
    window_size: 30
    floor_pct: 34.7
    min_sample_size: 10
  # M018/P03 — Tier 1 microcompact (tool-result paging + cache reuse).
  # When a tool-result block's body exceeds `inline_threshold_tokens`, the
  # body is replaced inline with a `<tool-result file="..." preview-lines="...">`
  # reference and the original is persisted to `cache_dir/<sha256>`. Cache
  # lookups key on SHA-256(command + 0x1F + input) so identical tool calls
  # across dispatches reuse the same file. `preview_lines` is the number of
  # leading body lines retained in-band so the receiving agent has a
  # zero-fetch summary.
  tier1:
    enabled: true
    inline_threshold_tokens: 1500
    preview_lines: 5
    cache_dir: .orchestrator/cache/tool-results/
  # M018/P04 — Tier 2 snip (head-drop with protected tail ratio).
  # When an in-scope section body's body-token count exceeds
  # `section_budget_tokens`, the leading bytes are head-dropped while the
  # trailing `protected_tail_ratio` of pre-snip section bytes survives
  # byte-identical. An in-band marker
  # `<!-- compressed:tier2 head_dropped=N protected_tail_ratio=R -->` names
  # the snip. The cut is line-aligned and refuses to split frontmatter,
  # 4+-backtick code fences, or other multi-line preserved spans
  # (cross-tier vocabulary in `scripts/lib/preservation-check.sh`). In-scope
  # sections: `## Knowledge`, `## Task Plan`, `## Upstream Context`.
  tier2:
    enabled: true
    section_budget_tokens: 1500
    protected_tail_ratio: 0.3
  # M018/P05/T02 — operator-facing surface knobs.
  efficiency_footer:
    enabled: true                 # Compression line in M027/P02 efficiency footer.
  regression_floor: 0.347         # SC-9 P00-calibrated savings-ratio floor.
