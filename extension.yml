    - file: scripts/diagnostics/check-recipe.sh
      executable: true
    - file: scripts/verify/validate-milestone.sh
      executable: true
    - file: scripts/state/find-active-milestone.sh
      executable: true
    - file: scripts/lifecycle/check-settings-state.sh
      executable: true
    - file: scripts/lifecycle/evaluate-preflight.sh
      executable: true
    - file: scripts/util/check-plan-exists.sh
      executable: true
    - file: scripts/util/detect-milestone-id.sh
      executable: true
    - file: scripts/util/classify-command.sh
      executable: true

defaults:
  default_tier: null
  verification_commands: []
  context_verbosity: standard
  git_isolation: false
  dispatch_budget: null
  duration_budget: null
  budget_enforcement: advisory
  session_weight_limit: 15
  autonomy:
    mode: null
    generate_on_init: true
    deny_patterns: []
    extra_allow: []

config_schema:
  type: object
  properties:
    default_tier:
      type: [string, "null"]
      enum: [A, B, C, null]
    verification_commands:
      type: array
      items:
        type: string
    context_verbosity:
      type: string
      enum: [minimal, standard, full]
    git_isolation:
      type: boolean
    dispatch_budget:
      type: [integer, "null"]
      minimum: 1
    duration_budget:
      type: [string, "null"]
    budget_enforcement:
      type: string
      enum: [advisory, enforced]
    session_weight_limit:
      type: [integer, "null"]
      minimum: 5
      description: "Max session context weight before rotating to a fresh context. Each task dispatch = 1 unit, each retry = +1, each phase transition = +3. Default 15 (~2-3 phases)."
    autonomy:
      type: object
      description: "Autonomy permission generation (P07). Policy defaults live in templates/autonomy-defaults.yaml."
      properties:
        mode:
          type: [string, "null"]
          enum: [minimal, standard, full, null]
          description: "Autonomy mode. null = tier default (A=minimal, B=standard, C=full)."
        generate_on_init:
          type: boolean
          description: "Run generate-permissions.sh during evaluate scaffold (FR-7)."
        deny_patterns:
          type: array
          items:
            type: string
          description: "Extra Bash/Read patterns appended to baseline_deny from autonomy-defaults.yaml."
        extra_allow:
          type: array
          items:
            type: string
          description: "Extra Bash/Read patterns appended to baseline_allow from autonomy-defaults.yaml."

hooks:
  before_tasks:
    command: speckit.orchestrator.evaluate
    optional: true
    prompt: "Evaluate project scope and classify execution tier?"
    description: "Injects phase-level context if orchestrator is active."

  after_tasks:
    command: speckit.orchestrator.roadmap
    optional: true
    prompt: "Generate orchestration roadmap from task phases?"
    description: "Triggers roadmap generation from tasks.md phases."

  before_implement:
    command: speckit.orchestrator.dispatch
    optional: true
    prompt: "Dispatch this phase via orchestrator?"
    description: "Injects phase scope enforcement for current phase."

  after_implement:
    command: speckit.orchestrator.verify
    optional: true
    prompt: "Run orchestrator verification on completed phase?"
    description: "Triggers phase summary generation and state advancement."

  before_commit:
    command: speckit.orchestrator.verify
    optional: true
    prompt: "Run tier-1 static verification before commit?"
    description: "Runs deterministic verification scripts to block commits when must-haves are unmet."

tags:
  - orchestration
  - automation
  - multi-phase
  - autonomous
