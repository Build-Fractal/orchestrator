schema_version: "1.0"

extension:
  id: speckit-orchestrator
  name: Speckit Orchestrator
  version: 0.2.0
  description: "Autonomous multi-phase orchestration for spec-kit's spec-driven development workflow. Adds milestone/phase/task hierarchy, state machine dispatch, crash recovery, and knowledge generation."
  author: clariti-care
  repository: https://github.com/clariti-care/spec-kit-orchestrator
  license: MIT

requires:
  speckit_version: ">=0.1.0"
  commands:
    - speckit.plan
    - speckit.tasks
    - speckit.implement
    - speckit.clarify
    - speckit.specify
    - speckit.analyze

provides:
  commands:
    - name: speckit.orchestrator.evaluate
      file: commands/evaluate.md
      description: "Use when starting a new project to classify scope as Tier A, B, or C."

    - name: speckit.orchestrator.discuss
      file: commands/discuss.md
      description: "Use when capturing architectural decisions and constraints before roadmap generation."

    - name: speckit.orchestrator.roadmap
      file: commands/roadmap.md
      description: "Use when breaking a spec into phases with dependency graph and boundary maps."

    - name: speckit.orchestrator.plan-phase
      file: commands/plan-phase.md
      description: "Use when planning one phase — creates task decomposition with must-haves."

    - name: speckit.orchestrator.dispatch
      file: commands/dispatch.md
      description: "Use when executing one task in a fresh context with constructed payload."

    - name: speckit.orchestrator.auto
      file: commands/auto.md
      description: "Use when starting autonomous execution — dispatches tasks until milestone completes."

    - name: speckit.orchestrator.verify
      file: commands/verify.md
      description: "Use when checking must-haves verification for a completed phase."

    - name: speckit.orchestrator.status
      file: commands/status.md
      description: "Use when checking progress — milestone/phase/task completion, blockers, next action."

    - name: speckit.orchestrator.resume
      file: commands/resume.md
      description: "Use when resuming from a crash or intentional pause using disk state."

    - name: speckit.orchestrator.consolidate
      file: commands/consolidate.md
      description: "Use when compressing knowledge and archiving verbose artifacts after milestone completion."

    - name: speckit.orchestrator.migrate
      file: commands/migrate.md
      description: "Use when migrating project data from GSD2, GSD v1, or spec-kit into orchestrator format."

    - name: speckit.orchestrator.doctor
      file: commands/doctor.md
      description: "Use when running diagnostics — detects orphaned artifacts, stale knowledge, scope mismatches, cost spikes."

  config:
    - file: orchestrator-config.yml
      template: templates/orchestrator-config-default.yml
      required: false

  scripts:
    - file: scripts/state/derive-phase.sh
      executable: true
    - file: scripts/state/read-roadmap.sh
      executable: true
    - file: scripts/state/read-config.sh
      executable: true
    - file: scripts/dispatch/build-context.sh
      executable: true
    - file: scripts/dispatch/scope-filter.sh
      executable: true
    - file: scripts/dispatch/detect-capabilities.sh
      executable: true
    - file: scripts/dispatch/classify-complexity.sh
      executable: true
    - file: scripts/dispatch/select-model.sh
      executable: true
    - file: scripts/verify/check-must-haves.sh
      executable: true
    - file: scripts/verify/check-boundary-map.sh
      executable: true
    - file: scripts/verify/run-commands.sh
      executable: true
    - file: scripts/verify/check-scope.sh
      executable: true
    - file: scripts/verify/check-external-mods.sh
      executable: true
    - file: scripts/knowledge/write-summary.sh
      executable: true
    - file: scripts/knowledge/append-decision.sh
      executable: true
    - file: scripts/knowledge/append-knowledge.sh
      executable: true
    - file: scripts/knowledge/consolidate-artifacts.sh
      executable: true
    - file: scripts/lifecycle/scaffold.sh
      executable: true
    - file: scripts/lifecycle/rollback-phase.sh
      executable: true
    - file: scripts/lifecycle/mark-complete.sh
      executable: true
    - file: scripts/lifecycle/lock-manager.sh
      executable: true
    - file: scripts/lifecycle/stuck-detector.sh
      executable: true
    - file: scripts/lifecycle/recovery-briefing.sh
      executable: true
    - file: scripts/lifecycle/budget-checker.sh
      executable: true
    - file: scripts/lifecycle/context-monitor.sh
      executable: true
    - file: scripts/lifecycle/record-result.sh
      executable: true
    - file: scripts/telemetry/record-telemetry.sh
      executable: true
    - file: scripts/telemetry/aggregate-metrics.sh
      executable: true
    - file: scripts/lifecycle/sync-roadmap.sh
      executable: true
    - file: scripts/lifecycle/auto-loop.sh
      executable: true
    - file: scripts/lifecycle/phase-transition.sh
      executable: true
    - file: scripts/util/json-field.sh
      executable: true
    - file: scripts/diagnostics/run-doctor.sh
      executable: true
    - file: scripts/diagnostics/check-orphaned.sh
      executable: true
    - file: scripts/diagnostics/check-stale.sh
      executable: true
    - file: scripts/diagnostics/check-scope.sh
      executable: true
    - file: scripts/diagnostics/check-cost-spikes.sh
      executable: true
    - file: scripts/lifecycle/generate-permissions.sh
      executable: true
    - file: scripts/lifecycle/write-permissions.sh
      executable: true
    - file: scripts/diagnostics/check-permissions.sh
      executable: true
    - file: scripts/diagnostics/check-instructions.sh
      executable: true
    - file: scripts/diagnostics/check-providers.sh
      executable: true
    - file: scripts/diagnostics/check-constitution.sh
      executable: true
    - file: scripts/diagnostics/check-events.sh
      executable: true
