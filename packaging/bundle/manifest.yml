# M032 P01: project_assets entries below are read by scripts/lifecycle/read-project-assets.sh
# and dispatched by the per-runtime installers (install-{claude-code,codex,cursor}.sh).
# See P01-PLAN.md key-link for the manifest → reader → installer chain.
schema_version: "1.0"
# ─── Bundle hygiene contract (M035 P02 T05) ──────────────────────
# Pre-publish filter rules (build-bundle.sh apply_bundle_hygiene_filter):
#   1. Pattern exclusion: files matching basename glob
#      `m[0-9]*-p[0-9]*-*` under any of:
#        scripts/verify/
#        tools/verify/
#        templates/conversus-presets/
#      are excluded from the staged bundle. This kills the bulk
#      milestone-internal verifier corpus in one rule.
#   2. Magic-comment opt-out: any file whose first 10 lines
#      contain a header line matching:
#        `^\s*#?\s*bundle:\s*dogfood-only`
#      is excluded. Self-documenting; tag dogfood-only artifacts
#      explicitly when authoring.
# Verified by tools/verify/m035-p02-bundle-hygiene-filter.sh and
# tools/verify/m035-p02-npm-pack-contents.sh. See proposal at
# .orchestrator/proposals/m035-bundle-hygiene-pre-publish-filter.md.
type: bundle-manifest
name: "orchestrator"
version: "0.9.6"
description: "Autonomous multi-phase orchestration skills for Claude Code, Codex, and Cursor"
skill_spec: "packaging/SKILL.md"
skills:
  - orchestrator-auto.md
  - orchestrator-consolidate.md
  - orchestrator-cost.md
  - orchestrator-discuss.md
  - orchestrator-dispatch.md
  - orchestrator-doctor.md
  - orchestrator-evaluate.md
  - orchestrator-migrate.md
  - orchestrator-plan-phase.md
  - orchestrator-resume.md
  - orchestrator-roadmap.md
  - orchestrator-status.md
  - orchestrator-verify.md
hooks:
  - event: before-tasks
    file: hooks/before-tasks.json
  - event: after-tasks
    file: hooks/after-tasks.json
  - event: before-implement
    file: hooks/before-implement.json
  - event: after-implement
    file: hooks/after-implement.json
  - event: before-commit
    file: hooks/before-commit.json
config_default: "config/orchestrator.default.yml"
runtime_compatibility:
  - claude-code
  - codex
  - cursor
# project_assets:
# Project-owned runtime payload staged into <PROJECT_DIR>/<target> by the
# installer's project-asset stage (FR-1 / FR-2). Each entry is processed
# through scripts/lifecycle/install-collision-check.sh (FR-22) and then
# scripts/lifecycle/install-asset-mode.sh (FR-3). v1 ships only mode: copy
# in the manifest; mode: symlink is exercised by the --asset-mode-override
# install flag in P01 and becomes manifest-declarable in P02+ (NG-9 keeps
# Windows fail-closed regardless).
project_assets:
  - source: commands/
    target: commands/
    mode: copy
  - source: scripts/
    target: scripts/
    mode: copy
  - source: references/
    target: references/
    mode: copy
  - source: templates/
    target: templates/
    mode: copy
  - source: wiki/
    target: wiki/
    mode: copy
