schema_version: "1.0"
type: bundle-manifest
name: "spec-kit-orchestrator"
version: "0.3.0-dev"
description: "Autonomous multi-phase orchestration skills for Claude Code, Codex, and Cursor"
skill_spec: "packaging/SKILL.md"
skills:
  - orchestrator-auto.md
  - orchestrator-consolidate.md
  - orchestrator-cost.md
  - orchestrator-discuss.md
  - orchestrator-dispatch.md
  - orchestrator-doctor.md
  - orchestrator-evaluate.md
  - orchestrator-migrate.md
  - orchestrator-plan-phase.md
  - orchestrator-resume.md
  - orchestrator-roadmap.md
  - orchestrator-status.md
  - orchestrator-verify.md
hooks:
  - event: before-tasks
    file: hooks/before-tasks.json
  - event: after-tasks
    file: hooks/after-tasks.json
  - event: before-implement
    file: hooks/before-implement.json
  - event: after-implement
    file: hooks/after-implement.json
  - event: before-commit
    file: hooks/before-commit.json
config_default: "config/orchestrator.default.yml"
runtime_compatibility:
  - claude-code
  - codex
  - cursor
# project_assets:
# Project-owned runtime payload staged into <PROJECT_DIR>/<target> by the
# installer's project-asset stage (FR-1 / FR-2). Each entry is processed
# through scripts/lifecycle/install-collision-check.sh (FR-22) and then
# scripts/lifecycle/install-asset-mode.sh (FR-3). v1 ships only mode: copy
# in the manifest; mode: symlink is exercised by the --asset-mode-override
# install flag in P01 and becomes manifest-declarable in P02+ (NG-9 keeps
# Windows fail-closed regardless).
project_assets:
  - source: commands/
    target: commands/
    mode: copy
  - source: scripts/
    target: scripts/
    mode: copy
  - source: references/
    target: references/
    mode: copy
  - source: templates/
    target: templates/
    mode: copy
