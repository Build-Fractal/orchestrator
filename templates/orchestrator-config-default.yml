# Speckit-Orchestrator Project Configuration
# Copy to orchestrator-config.yml in your project root and customize.
# Valid values are documented alongside each key below.

default_tier: null              # Auto-detect. Override: A, B, or C
verification_commands: []       # Run after each task (e.g., ["npm test", "npm run lint"])
context_verbosity: standard     # minimal | standard | full
git_isolation: false            # Use git worktree per milestone
dispatch_budget: null           # Max dispatches per milestone (null = unlimited)
duration_budget: null           # Max cumulative duration (null = unlimited, e.g., "2h")
budget_enforcement: advisory    # advisory (warn only) | enforced (hard stop)

# Universal intake routing fast-path (M024 — FR-3, NG-6, #Q-7)
# When auto_proceed is true (default) AND a proposal lands at all four:
#   scope_tier == "A"        AND
#   intensity == "Quick"     AND
#   conversus_gate == "none" AND
#   design_gate == "none"
# …`orchestrator:evaluate` flips `auto_proceeded: true` in the emitted
# proposal frontmatter and dispatches without an approval prompt. Any
# condition violation (or this key set to false) routes the proposal
# through the operator approve / revise / cancel gate as before.
#
# Set to false project-wide to disable the fast-path entirely (every
# proposal halts at the approval gate). Per AD-1 there is no per-invocation
# CLI flag — this is a project-config-only knob (#Q-7).
#
# M031 (right-sized entry, 2026-05-01) flipped this default from false
# to true and made Quick-profile knowledge injection unconditional. Set
# quick_knowledge_token_budget below to tune the Quick-profile knowledge
# ceiling. Operators who prefer the pre-M031 behavior should add an
# explicit `auto_proceed: false` line to their .orchestrator/config.yml.
auto_proceed: true              # true (default) | false

# Autonomy permission generation (P07 — FR-1)
# Policy defaults live in templates/autonomy-defaults.yaml (baseline deny,
# baseline allow, tier->mode mapping, introspection rules). This block lets
# projects override or extend those defaults.
#
# Four-layer resolution (FR-1): env > .local > project > defaults. Resolution
# is implemented in scripts/state/read-config.sh and operates key-by-key: the
# first layer that declares a non-empty value for a given key wins, and other
# keys at the same block continue to resolve from lower layers independently.
# There is no deep-merge of nested objects — setting `autonomy.extra_allow`
# in orchestrator-config.local.yml overrides only that key, while
# `autonomy.mode`, `autonomy.generate_on_init`, and `autonomy.deny_patterns`
# continue to resolve from the project file (or defaults). This matches the
# existing semantics for verification_commands and every other config block
# (AD-17: document actual behavior, do not invent new semantics).
autonomy:
  mode: null                    # null = tier default (A=minimal, B=standard, C=full). Override: minimal, standard, full
  generate_on_init: true        # Run generate-permissions.sh during evaluate scaffold (FR-7)
  deny_patterns: []             # Extra Bash/Read patterns to append to the baseline deny list
  extra_allow: []               # Extra Bash/Read patterns to append to the baseline allow list

# Context Compression Layer (M018)
# Master toggle (FR-15): when `enabled: false`, the entire compression
# pipeline short-circuits and dispatch payloads are byte-identical to the
# pre-M018 baseline. Per-tier toggles let operators enable individual
# stages independently.
compression:
  enabled: true                 # Master toggle. false → entire pipeline disabled.
  knowledge_filter:
    enabled: true               # FR-3: knowledge-aware status filter toggle.
    # Knowledge entries whose YAML frontmatter `status:` field matches any
    # value below are excluded from dispatch payloads. Missing `status:` →
    # RETAINED (fail-open per A-1 + grammar contract `## Tier: filter`).
    drop_list:
      - superseded
      - experimental
  # M018/P02/T03 (MIT-09): aggregate-savings underperformance self-check.
  # Operational signal — emits a `compression_underperformance` JSONL record
  # when the running mean payload-token reduction across the last
  # `window_size` `payload_breakdown` records falls below `floor_pct` (the
  # SC-9 calibrated 34.7% floor from P00's 80% CI lower bound). Never blocks
  # dispatch. `min_sample_size` guards against spurious alarms while P02 is
  # the only shipping tier (tier1/tier2/tier3 land in P03/P04/P06).
  underperformance:
    enabled: true                 # Self-check toggle.
    window_size: 30               # Last N payload_breakdown records considered.
    floor_pct: 34.7               # SC-9 calibrated floor.
    min_sample_size: 10           # Skip when count < min_sample_size.
  # M018/P03 — Tier 1 microcompact (tool-result paging + cache reuse).
  # When a tool-result block's body exceeds `inline_threshold_tokens`, the
  # body is replaced inline with a `<tool-result file="..." preview-lines="...">`
  # reference and the original is persisted to `cache_dir/<sha256>`. Cache
  # lookups key on SHA-256(command + 0x1F + input) so identical tool calls
  # across dispatches reuse the same file. `preview_lines` is the number of
  # leading body lines retained in-band so the receiving agent has a
  # zero-fetch summary.
  tier1:
    enabled: true                 # Per-tier toggle (master `enabled:` above also gates).
    inline_threshold_tokens: 1500 # Bodies above this token estimate get paged.
    preview_lines: 5              # Leading body lines retained inline.
    cache_dir: .orchestrator/cache/tool-results/  # Relative path resolved against PROJECT_ROOT.
  # M018/P04 — Tier 2 snip (head-drop with protected tail ratio).
  # When an in-scope section body's body-token count exceeds
  # `section_budget_tokens`, the leading bytes are head-dropped while the
  # trailing `protected_tail_ratio` of pre-snip section bytes survives
  # byte-identical. An in-band marker
  # `<!-- compressed:tier2 head_dropped=N protected_tail_ratio=R -->` names
  # the snip. The cut is line-aligned and refuses to split frontmatter,
  # 4+-backtick code fences, or other multi-line preserved spans
  # (cross-tier vocabulary in `scripts/lib/preservation-check.sh`). In-scope
  # sections: `## Knowledge`, `## Task Plan`, `## Upstream Context`.
  tier2:
    enabled: true                 # Per-tier toggle (master `enabled:` above also gates).
    section_budget_tokens: 1500   # Section body token-count cap before head-drop fires.
    protected_tail_ratio: 0.3     # Fraction of pre-snip body bytes preserved verbatim at the tail.
  # M018/P06 — Tier 3 auto-compact (LLM-routed section summarization).
  # Routes the largest oversized section (post-Tier 1 + Tier 2) through a
  # summarization prompt via dispatch-interface.sh (or the
  # scripts/dispatch/lib/tier3-llm-call.sh shim). Originals persist to
  # `originals_dir` keyed by sha256 of the pre-call section bytes for
  # audit + eval-harness replay. Output exceeding `output_max_ratio` of
  # input bytes is discarded (passthrough). MIT-08 density pre-check skips
  # the LLM call when input_tokens / section_budget_tokens < density_floor.
  # Failure-passthrough (FR-9) on every error path: dispatch-interface
  # non-zero, empty output, preservation breach -> tier3_failed JSONL +
  # zero stats. FR-14 intensity gate: Quick skips T3.
  tier3:
    enabled: true                 # Per-tier toggle (master `enabled:` above also gates).
    intensity_floor: standard     # quick | standard | full — Quick skips T3 (FR-14).
    section_budget_tokens: 2500   # Sections above this token-count cap are eligible for T3.
    originals_dir: .orchestrator/cache/tier3-originals/  # Relative path resolved against PROJECT_ROOT.
    output_max_ratio: 0.80        # Discard summaries exceeding 80% of input bytes.
    density_floor: 1.5            # MIT-08: skip T3 when input_tokens/budget < floor.
  # M018/P05/T02 — operator-facing surface knobs.
  # `efficiency_footer.enabled` toggles the one-line "compression: <pct>%
  # reduction over baseline (filter+tier1+tier2 / payload_tokens)" tail
  # appended to the M027/P02 efficiency footer. Independent of the parent
  # `efficiency_footer` knob — the parent suppresses the whole footer; this
  # knob suppresses only the compression line. Default true.
  # `regression_floor` is the savings ratio below which `check-anomalies.sh`
  # fires `compression-regression`. Pinned to the SC-9 P00-calibrated 34.7%
  # floor; configurable so future calibration updates do not require code
  # changes.
  efficiency_footer:
    enabled: true                 # M018/P05/T02 — compression line in efficiency footer.
  regression_floor: 0.347         # M018/P05/T02 — SC-9 P00-calibrated savings-ratio floor.

# M031 — Right-sized entry (knowledge + compression unconditional, Tier A+ flow,
# universal entry). Knobs pinned by P00 empirical baseline; AD-5 / OQ-4 / AD-20.
quick_knowledge_token_budget: 800            # FR-5 / AD-5 — advisory ceiling for Quick-profile knowledge inject; M018 tier-2 snip enforces.
entry_routing_confidence_floor: 0.7          # FR-11 / OQ-4 — universal-entry classifier confidence below which the operator is prompted Tier A vs Tier B.
tier_a_plus_prompt_summary_lines: 8          # AD-20 — number of leading lines of research.md rendered inline in the Tier A+ pre-plan approval prompt.

# M029 — display_thresholds (AD-5).
# FR-8 / AD-5 — minimum compression savings ratio (as a percentage of total
# dispatch tokens) below which the live-tail render suppresses the
# `▽ saved Nk` marker on a `dispatch_usage` row. Heuristic default.
# Tune after first 10 milestones of M019 Tier 1 + M018 Tier 2 telemetry.
# Review trigger: re-evaluate threshold once
# `metrics-rollup.sh --scope milestone` shows median savings ≥ 3% across
# closed milestones.
display_thresholds:
  compression_savings_pct: 5.0

# M041 — orchestrator:detective (issue triage → GitHub).
# repo            target repo for issue search/filing (overridable per-run
#                 with --repo). Defaults to the orchestrator upstream; forks
#                 set this to their own owner/name.
# match_threshold keyword-overlap count at/above which a search hit counts as
#                 a duplicate "match" (comment) rather than a new issue.
#                 PROVISIONAL + UNVALIDATED (conversus RISK-06 / spec #Q-1):
#                 calibrate against the real issue corpus via
#                 scripts/diagnostics/detective-validate-threshold.sh before
#                 using --yes in automated/unattended invocations.
detective:
  repo: Build-Fractal/orchestrator
  match_threshold: 3

# M037 — Wiki team-feedback-ready (FR-2).
# The wiki: namespace is orchestrator-managed. Operator-authored values for
# any keys NOT enumerated in the framework default are preserved by the
# FR-10 yaml-merge primitive; new orchestrator-managed keys added in
# future releases will merge under wiki:.
#
# landing_cards drives the homepage card grid. Each entry declares
# section (path to a top-level nav file/dir), icon (mkdocs-material emoji
# shortcode without leading/trailing colons), title (string), blurb
# (string). When the list is empty, the stub generator falls back to
# defaults derived from the top-level nav sections (FR-3) by looking up
# section names in the DEFAULT_BLURBS table inside
# templates/wiki-index-cards.md.tmpl. Operators customize this list to
# point readers at the content they want feedback on.
wiki:
  landing_cards: []             # M037 FR-2 — operator-customizable card list.

  # --- Wiki readability decorator (scripts/wiki/wiki-decorate-build.py) ---
  # Two project-tunable knobs that drive code-decoration. With both
  # empty, the decorator still operates against .orchestrator/DECISIONS.md
  # (zero-config behavior — every orchestrator-managed project gets DR-###
  # hover-tooltip links for free).
  #
  # code_prefixes: spec-table column-A prefixes to scan in spec_paths.
  #   Each prefix matches `| <prefix>-\d+ | Title | …` rows. Common
  #   project conventions include AN/BG/OD (PBJ Analyzer), FR/SC/US
  #   (spec-kit features), AC (acceptance), MIT (mitigation). Define
  #   only the prefixes that appear as table-row codes in your spec(s).
  # spec_paths: .orchestrator-relative paths to spec markdown files
  #   that contain pipe-table-coded rows. Multiple paths are scanned
  #   in order; later entries do not override earlier ones for the
  #   same code.
  code_prefixes: []             # e.g. [AN, BG, OD]
  spec_paths: []                # e.g. [spec/<plan>.md]

