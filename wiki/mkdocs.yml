# wiki/mkdocs.yml — orchestrator dogfood wiki.
#
# This config is assembled across M012/P01 in stages:
#   T01 writes this base (theme + plugins + markdown_extensions).
#   T04 appends a nav: block referencing every in-scope .orchestrator/**.md
#        artifact via include-plugin stubs under wiki/docs/.
# Do not edit the nav: block by hand — regenerate via
# scripts/wiki/wiki-generate-nav.sh.

site_name: "orchestrator"
site_description: "Browseable projection of .orchestrator/ artifacts for the dogfood team."
site_url: ""
repo_url: "https://github.com/Build-Fractal/orchestrator"
edit_uri: "edit/main/wiki/docs/"
docs_dir: "docs"
site_dir: "site"
exclude_docs: |
  README.md

theme:
  name: material
  custom_dir: overrides          # <-- added in M012/P03/T01 (Giscus partial)
  features:
    # >>> M037-P01-T05 polish-bundle features (FR-9)
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.prune
    # <<< M037-P01-T05 polish-bundle features
    # navigation.sections intentionally omitted (M037 P03 round-5):
    # the flag forces top-level groups to render as bold flat lists.
    # Default Material behavior (no sections feature) renders each
    # group as a collapsible drawer, which matches reader expectations
    # for sections like `Reference — *` and `Milestones`. Independent
    # of navigation.indexes (kept).
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    # >>> M037-P01-T05 polish-bundle action affordances (FR-9)
    - content.action.edit
    - content.action.view
    # <<< M037-P01-T05 polish-bundle action affordances

plugins:
  - search
  - include-markdown:
      rewrite_relative_urls: true
      heading_offset: 0

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 2
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  # >>> M037-P01-T05 polish-bundle markdown extensions (FR-9)
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
  # <<< M037-P01-T05 polish-bundle markdown extensions
  # >>> M037-P03 (P1.1) — render :fontawesome-…: / :octicons-…: card icons
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  # <<< M037-P03 (P1.1) emoji

# >>> M037-P01-T04 extra_css (Surface E Option B — code-chip pill styling)
extra_css:
  - stylesheets/code-chips.css
# <<< M037-P01-T04 extra_css end

# >>> M012-P03 extra (Giscus wiring — T01)
extra:
  giscus:
    repo:        !ENV [GISCUS_REPO,        ""]
    repo_id:     !ENV [GISCUS_REPO_ID,     ""]
    category:    !ENV [GISCUS_CATEGORY,    ""]
    category_id: !ENV [GISCUS_CATEGORY_ID, ""]
    mapping:     "pathname"
# <<< M012-P03 extra end

# nav: block intentionally omitted here; regenerated by
# scripts/wiki/wiki-generate-nav.sh in T04.


