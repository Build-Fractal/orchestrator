# wiki/mkdocs.yml — spec-kit-orchestrator dogfood wiki.
#
# This config is assembled across M012/P01 in stages:
#   T01 writes this base (theme + plugins + markdown_extensions).
#   T04 appends a nav: block referencing every in-scope .orchestrator/**.md
#        artifact via include-plugin stubs under wiki/docs/.
# Do not edit the nav: block by hand — regenerate via
# scripts/wiki/wiki-generate-nav.sh.

site_name: "spec-kit-orchestrator — dogfood wiki"
site_description: "Browseable projection of .orchestrator/ artifacts for the dogfood team."
site_url: "https://build-fractal.github.io/spec-kit-orchestrator/"
repo_url: "https://github.com/Build-Fractal/spec-kit-orchestrator"
docs_dir: "docs"
site_dir: "site"
exclude_docs: |
  README.md

theme:
  name: material
  custom_dir: overrides          # <-- added in M012/P03/T01 (Giscus partial)
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search
  - include-markdown:
      rewrite_relative_urls: true
      heading_offset: 0

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true

# >>> M012-P03 extra (Giscus wiring — T01)
extra:
  giscus:
    repo:        !ENV [GISCUS_REPO,        ""]
    repo_id:     !ENV [GISCUS_REPO_ID,     ""]
    category:    !ENV [GISCUS_CATEGORY,    ""]
    category_id: !ENV [GISCUS_CATEGORY_ID, ""]
    mapping:     "pathname"
# <<< M012-P03 extra end

# nav: block intentionally omitted here; regenerated by
# scripts/wiki/wiki-generate-nav.sh in T04.

# <<< M012-P01 nav end

